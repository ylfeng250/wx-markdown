<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="微信发稿台：把 Markdown 转成可粘贴到公众号的 HTML">
  <title>微信发稿台</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <p class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="name">微信发稿台</span>
      </p>

      <div class="tools">
        <label class="field">
          <span>主题</span>
          <select id="theme"></select>
        </label>
        <label class="switch">
          <input id="links" type="checkbox">
          <span>文末链接</span>
        </label>
        <button id="open-btn" type="button" class="ghost">打开稿件</button>
        <input id="file" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden>
      </div>

      <div class="actions">
        <button id="draft-btn" type="button" class="ghost" hidden>推草稿箱</button>
        <button id="copy-btn" type="button" class="copy" aria-label="复制到公众号">
          <span class="seal" aria-hidden="true"></span>
          <span id="copy-word">复制</span>
        </button>
      </div>
    </header>

    <main class="work">
      <section class="col manuscript">
        <div class="col-head">
          <p class="slab" id="file-label">原稿</p>
        </div>
        <div class="sheet">
          <textarea id="source" spellcheck="false" autocomplete="off" aria-label="原稿"></textarea>
        </div>
      </section>

      <section class="col stage">
        <div class="col-head">
          <p class="slab">校样</p>
          <span class="hint" id="theme-label">终端</span>
        </div>
        <div class="proof">
          <div class="phone">
            <div class="phone-cap" aria-hidden="true"></div>
            <div class="phone-screen" id="preview"></div>
            <div class="phone-home" aria-hidden="true"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="drop" id="drop" aria-hidden="true">
    <p>放开即可打开稿件</p>
  </div>

  <div class="draft-mask" id="draft-panel" hidden>
    <div class="draft-card">
      <p class="slab">推到草稿箱</p>
      <label class="draft-field">
        <span>标题</span>
        <input id="draft-title" type="text" autocomplete="off">
      </label>
      <label class="draft-field">
        <span>摘要</span>
        <input id="draft-digest" type="text" autocomplete="off">
      </label>
      <label class="draft-field">
        <span>封面</span>
        <input id="draft-cover" type="file" accept="image/*">
      </label>
      <p class="draft-hint" id="draft-hint"></p>
      <div class="draft-actions">
        <button id="draft-cancel" type="button" class="ghost">取消</button>
        <button id="draft-confirm" type="button" class="copy">推送</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
